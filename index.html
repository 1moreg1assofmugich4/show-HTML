<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Time Stacker</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#F4F5F7;font-family:system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
  input[type="time"]::-webkit-calendar-picker-indicator{filter:invert(1)}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const{useState,useEffect,useCallback,useRef}=React;
const ID=()=>Math.random().toString(36).slice(2,10);
const COLORS=["#4A90D9","#6BBF6A","#E8935A","#B07CC6","#D4A84A","#5BA8A0"];
const dc=d=>COLORS[d%COLORS.length];
const toMin=t=>{const[h,m]=t.split(":").map(Number);return h*60+m};
const toTime=m=>{const v=((m%1440)+1440)%1440;return`${String(Math.floor(v/60)).padStart(2,"0")}:${String(v%60).padStart(2,"0")}`};
const fmtD=m=>{if(m<60)return`${m}分`;const h=Math.floor(m/60),r=m%60;return r?`${h}h${r}m`:`${h}h`};
const dur=t=>{if(t.isItem)return 0;if(!t.children?.length)return t.duration||0;const tk=t.children.filter(c=>!c.isItem);return tk.length===0?(t.duration||0):tk.reduce((s,c)=>s+dur(c),0)};
const allDone=t=>!t.children?.length?!!t.checked:t.children.every(c=>allDone(c));
const cntDone=t=>!t.children?.length?(t.checked?1:0):t.children.reduce((s,c)=>s+cntDone(c),0);
const cntAll=t=>!t.children?.length?1:t.children.reduce((s,c)=>s+cntAll(c),0);
const isDesc=(n,id)=>n.id===id||(n.children||[]).some(c=>isDesc(c,id));
const flat=(tasks,start,depth=0,anc=[])=>{const out=[];let cur=start;for(const t of tasks){const d=dur(t),htk=t.children?.some(c=>!c.isItem)||false,hik=t.children?.some(c=>c.isItem)||false,grp=htk,colors=t.isItem?[]:[...anc,dc(depth)];out.push({id:t.id,name:t.name,start:cur,end:cur+d,dur:d,depth,grp,col:t.collapsed,chk:t.checked,colors,isItem:!!t.isItem,showT:!t.isItem&&(!grp||t.collapsed),ad:allDone(t),dn:cntDone(t),tt:cntAll(t),hik,hasKids:!!t.children?.length});if(t.children?.length){if(grp&&!t.collapsed)out.push(...flat(t.children,cur,depth+1,colors));else if(!grp&&hik)out.push(...flat(t.children.filter(c=>c.isItem),cur,depth+1,colors))}if(!t.isItem)cur+=d}return out};
const mapT=(ts,id,fn)=>ts.map(t=>t.id===id?fn(t):t.children?.length?{...t,children:mapT(t.children,id,fn)}:t);
const delT=(ts,id)=>ts.filter(t=>t.id!==id).map(t=>t.children?.length?{...t,children:delT(t.children,id)}:t);
const findT=(ts,id)=>{for(const t of ts){if(t.id===id)return t;if(t.children?.length){const r=findT(t.children,id);if(r)return r}}return null};
const findP=(ts,id,p=null)=>{for(const t of ts){if(t.id===id)return p;if(t.children?.length){const r=findP(t.children,id,t);if(r!==undefined)return r}}};
const findS=(ts,id)=>{if(ts.some(s=>s.id===id))return ts;for(const t of ts){if(t.children?.length){const r=findS(t.children,id);if(r)return r}}return null};
const sw=(a,i,j)=>{const c=[...a];[c[i],c[j]]=[c[j],c[i]];return c};
const rstChk=ts=>ts.map(t=>({...t,checked:false,children:t.children?.length?rstChk(t.children):t.children}));
const deepCopy=o=>JSON.parse(JSON.stringify(o));
const todayStr=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const shiftDay=(s,n)=>{const d=new Date(s+"T00:00:00");d.setDate(d.getDate()+n);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`};
const fmtDateJP=s=>{const d=new Date(s+"T00:00:00");const w=["日","月","火","水","木","金","土"];return`${d.getMonth()+1}/${d.getDate()}(${w[d.getDay()]})`};
const dayKey=d=>`ts3-day-${d}`;
const PRE_KEY="ts3-presets";
const loadLS=(k,fb)=>{try{const r=localStorage.getItem(k);return r?JSON.parse(r):fb}catch{return fb}};
const saveLS=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}};
const regenIds=ts=>ts.map(t=>({...t,id:ID(),children:t.children?.length?regenIds(t.children):t.children}));

const SAMPLE=[
  {id:ID(),name:"朝",collapsed:false,checked:false,children:[
    {id:ID(),name:"朝食",collapsed:false,checked:false,children:[
      {id:ID(),name:"準備",duration:20,checked:false,children:[
        {id:ID(),name:"卵",duration:0,children:[],checked:false,isItem:true},
        {id:ID(),name:"パン",duration:0,children:[],checked:false,isItem:true},
      ]},
      {id:ID(),name:"食事",duration:30,children:[],checked:false},
      {id:ID(),name:"片付け",duration:10,children:[],checked:false},
    ]},
    {id:ID(),name:"身支度",duration:30,children:[],checked:false},
  ]},
  {id:ID(),name:"家事",duration:60,children:[],checked:false},
  {id:ID(),name:"筋トレ",duration:120,children:[],checked:false},
];

function App(){
  const[tasks,setTasks]=useState([]);
  const[st,setSt]=useState("07:00");
  const[aDate,setADate]=useState(todayStr);
  const[editing,setEditing]=useState(null);
  const[eName,setEName]=useState("");
  const[eDur,setEDur]=useState("");
  const[mode,setMode]=useState("view");
  const[loaded,setLoaded]=useState(false);
  const[addTgt,setAddTgt]=useState(null);
  const[nName,setNName]=useState("");
  const[nDur,setNDur]=useState("30");
  const[nIsItem,setNIsItem]=useState(false);
  const[swiped,setSwiped]=useState(null);
  const[hist,setHist]=useState([]);
  const[futr,setFutr]=useState([]);
  const[movId,setMovId]=useState(null);
  const[now,setNow]=useState(new Date());
  const[presets,setPresets]=useState([]);
  const[showPre,setShowPre]=useState("none");
  const[preName,setPreName]=useState("");
  const[preEdit,setPreEdit]=useState(false);
  const[preEditName,setPreEditName]=useState("");
  const[savedDay,setSavedDay]=useState(null);
  const[newPreName,setNewPreName]=useState("");
  const[pendPre,setPendPre]=useState(null);
  const tRef=useRef({});

  useEffect(()=>{
    const today=todayStr();
    const data=loadLS(dayKey(today),null);
    if(data){setTasks(regenIds(data.tasks||[]));setSt(data.st||"07:00")}
    else setTasks(SAMPLE);
    setPresets(loadLS(PRE_KEY,[]));
    setLoaded(true);
  },[]);

  useEffect(()=>{
    const t=setInterval(()=>setNow(new Date()),30000);
    return()=>clearInterval(t);
  },[]);

  const preEditRef=useRef(false);
  useEffect(()=>{preEditRef.current=preEdit},[preEdit]);
  const save=useCallback((t,s)=>{if(!preEditRef.current)saveLS(dayKey(aDate),{tasks:t,st:s})},[aDate]);

  const resetUI=()=>{setEditing(null);setAddTgt(null);setSwiped(null);setMovId(null);setNIsItem(false);setShowPre("none");setHist([]);setFutr([]);setPendPre(null)};

  const goDay=(nd)=>{
    saveLS(dayKey(aDate),{tasks,st});
    const data=loadLS(dayKey(nd),null);
    if(data){setTasks(regenIds(data.tasks||[]));setSt(data.st||"07:00")}
    else{setTasks([]);setSt("07:00")}
    setADate(nd);resetUI();
  };

  const startPreEdit=(name)=>{
    setSavedDay({tasks:deepCopy(tasks),st,date:aDate});
    setTasks([]);setSt("07:00");
    setPreEdit(true);setPreEditName(name);
    setShowPre("none");setMode("edit");resetUI();
  };
  const savePreEdit=()=>{
    if(tasks.length>0){const np=[...presets,{id:ID(),name:preEditName,tasks:deepCopy(tasks),st}];setPresets(np);saveLS(PRE_KEY,np)}
    if(savedDay){setTasks(savedDay.tasks);setSt(savedDay.st);saveLS(dayKey(savedDay.date),{tasks:savedDay.tasks,st:savedDay.st})}
    setPreEdit(false);setMode("view");resetUI();setSavedDay(null);
  };
  const cancelPreEdit=()=>{
    if(savedDay){setTasks(savedDay.tasks);setSt(savedDay.st)}
    setPreEdit(false);setMode("view");resetUI();setSavedDay(null);
  };

  const up=(t,s)=>{setHist(h=>[...h.slice(-29),{tasks,st}]);setFutr([]);setTasks(t);if(s!==undefined)setSt(s);save(t,s!==undefined?s:st)};
  const undo=()=>{if(!hist.length)return;const p=hist[hist.length-1];setFutr(f=>[...f,{tasks,st}]);setHist(h=>h.slice(0,-1));setTasks(p.tasks);setSt(p.st);save(p.tasks,p.st)};
  const redo=()=>{if(!futr.length)return;const n=futr[futr.length-1];setHist(h=>[...h,{tasks,st}]);setFutr(f=>f.slice(0,-1));setTasks(n.tasks);setSt(n.st);save(n.tasks,n.st)};

  const toggle=id=>{const t=findT(tasks,id);if(!t)return;const htk=t.children?.some(c=>!c.isItem)||false;if(t.isItem||!t.children?.length||!htk)up(mapT(tasks,id,x=>({...x,checked:!x.checked})))};
  const onTS=(e,id)=>{tRef.current={x:e.touches[0].clientX,y:e.touches[0].clientY,id,sw:false}};
  const onTM=(e,id)=>{if(tRef.current.id!==id)return;const dx=tRef.current.x-e.touches[0].clientX,dy=Math.abs(tRef.current.y-e.touches[0].clientY);if(dy>30&&!tRef.current.sw){tRef.current.id=null;return}if(dx>50){setSwiped(id);tRef.current.sw=true}else if(dx<-20&&tRef.current.sw)setSwiped(null)};
  const addChild=pid=>{if(!nName.trim())return;const nd={id:ID(),name:nName.trim(),duration:nIsItem?0:(parseInt(nDur)||30),children:[],checked:false,isItem:nIsItem};if(!pid)up([...tasks,nd]);else up(mapT(tasks,pid,t=>({...t,children:[...(t.children||[]),nd],collapsed:false})));setNName("");setNDur("30");setAddTgt(null);setNIsItem(false)};
  const del=id=>{up(delT(tasks,id));setSwiped(null)};
  const startEd=id=>{const t=findT(tasks,id);if(!t)return;setEditing(id);setEName(t.name);setEDur(String(t.isItem?"":(t.children?.some(c=>!c.isItem)?"":(t.duration||0))))};
  const saveEd=()=>{if(!editing)return;up(mapT(tasks,editing,t=>({...t,name:eName||t.name,...(t.isItem||t.children?.some(c=>!c.isItem)?{}:{duration:parseInt(eDur)||t.duration})})));setEditing(null)};
  const mv=(id,dir)=>{const sibs=findS(tasks,id);if(!sibs)return;const i=sibs.findIndex(t=>t.id===id),j=i+dir;if(j<0||j>=sibs.length)return;const p=findP(tasks,id);if(!p)up(sw(tasks,i,j));else up(mapT(tasks,p.id,t=>({...t,children:sw(t.children,i,j)})))};
  const moveToTarget=tid=>{if(!movId)return;const task=findT(tasks,movId);if(!task)return;if(tid!==null&&(tid===movId||isDesc(task,tid)))return;const rem=delT(tasks,movId);up(tid===null?[...rem,{...task}]:mapT(rem,tid,t=>({...t,children:[...(t.children||[]),{...task}],collapsed:false})));setMovId(null)};
  const togCol=id=>up(mapT(tasks,id,t=>({...t,collapsed:!t.collapsed})));

  const resync=()=>{
    const n=new Date();const nowM=n.getHours()*60+n.getMinutes();
    const fi=items.find(it=>!it.isItem&&!it.grp&&!it.ad&&!it.chk);
    if(!fi)return;
    const newSt=toTime(toMin(st)+(nowM-fi.start));
    up(tasks,newSt);
  };

  // Presets
  const savePre=()=>{if(!preName.trim())return;const np=[...presets,{id:ID(),name:preName.trim(),tasks:deepCopy(tasks),st}];setPresets(np);saveLS(PRE_KEY,np);setPreName("")};
  const loadPre=p=>{setPendPre(p);setShowPre("none")};
  const placePre=tid=>{
    if(!pendPre)return;
    const ct=regenIds(rstChk(deepCopy(pendPre.tasks)));
    if(tid===null)up([...tasks,...ct]);
    else up(mapT(tasks,tid,t=>({...t,children:[...(t.children||[]),...ct],collapsed:false})));
    setPendPre(null);
  };
  const delPre=id=>{const np=presets.filter(p=>p.id!==id);setPresets(np);saveLS(PRE_KEY,np)};

  const items=flat(tasks,toMin(st));
  const total=tasks.reduce((s,t)=>s+dur(t),0);
  const movTask=movId?findT(tasks,movId):null;
  const isMovable=id=>movId&&id!==movId&&findT(tasks,movId)&&!isDesc(findT(tasks,movId),id);
  const isToday=aDate===todayStr();
  const nowMin=now.getHours()*60+now.getMinutes();
  const nowTime=`${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;

  const addForm=(pid,pd)=>{
    const color=dc((pd||0)+1);const pt=pid&&pid!=="__root__"?findT(tasks,pid):null;
    return(<div style={{padding:10,background:"#fff",borderRadius:6,border:pid==="__root__"?"none":`1.5px dashed ${color}`,...(pid==="__root__"?{boxShadow:"0 4px 16px rgba(0,0,0,0.15)",width:"calc(100% - 32px)",maxWidth:340}:{margin:"3px 0 3px 16px"})}}>
      {pt&&<div style={{fontSize:11,color,fontWeight:600,marginBottom:5}}>「{pt.name}」に追加</div>}
      {pid==="__root__"&&<div style={{fontSize:12,fontWeight:600,color:"#2C3E50",marginBottom:6}}>ルート追加</div>}
      <div style={{display:"flex",gap:0,marginBottom:8,borderRadius:6,overflow:"hidden",border:"1px solid #ddd"}}>
        <button onClick={()=>setNIsItem(false)} style={{flex:1,padding:"5px 0",fontSize:12,fontWeight:600,border:"none",cursor:"pointer",background:!nIsItem?"#2C3E50":"#f5f5f5",color:!nIsItem?"#fff":"#888"}}>タスク</button>
        <button onClick={()=>setNIsItem(true)} style={{flex:1,padding:"5px 0",fontSize:12,fontWeight:600,border:"none",cursor:"pointer",background:nIsItem?"#2C3E50":"#f5f5f5",color:nIsItem?"#fff":"#888"}}>アイテム</button>
      </div>
      <div style={{display:"flex",gap:5,flexWrap:"wrap"}}>
        <input value={nName} onChange={e=>setNName(e.target.value)} placeholder={nIsItem?"アイテム名":"タスク名"} autoFocus style={{...inpS,flex:1,minWidth:80}}/>
        {!nIsItem&&<div style={{display:"flex",alignItems:"center",gap:3}}>
          <input value={nDur} onChange={e=>setNDur(e.target.value)} type="number" min="1" style={{...inpS,width:50}}/>
          <span style={{fontSize:11,color:"#888"}}>分</span></div>}
      </div>
      <div style={{display:"flex",gap:5,marginTop:6}}>
        <button onClick={()=>addChild(pid==="__root__"?null:pid)} style={{...savBtn,...(pid!=="__root__"?{background:color}:{})}}>追加</button>
        <button onClick={()=>{setAddTgt(null);setNIsItem(false)}} style={canBtn}>取消</button>
      </div>
    </div>);
  };

  if(!loaded)return<div style={loadS}>読み込み中...</div>;

  return(
    <div style={{fontFamily:"system-ui,-apple-system,sans-serif",background:"#F4F5F7",minHeight:"100vh",color:"#1a1a2e",WebkitTapHighlightColor:"transparent"}}>
      {/* Header */}
      <div style={{background:preEdit?"linear-gradient(135deg,#5B3A8C 0%,#7B4FB0 100%)":"linear-gradient(135deg,#2C3E50 0%,#34495E 100%)",color:"#fff",padding:"12px 16px",position:"sticky",top:0,zIndex:10}}>
        {preEdit?(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div>
                <div style={{fontSize:10,opacity:0.6}}>プリセット編集中</div>
                <div style={{fontSize:16,fontWeight:700}}>{preEditName}</div>
              </div>
              <div style={{display:"flex",gap:5}}>
                <button onClick={savePreEdit} style={{...hdrBtn,background:"#E8C547",color:"#1a1a2e"}}>保存して戻る</button>
                <button onClick={cancelPreEdit} style={hdrBtn}>破棄</button>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginTop:8}}>
              <span style={{fontSize:12,opacity:0.65}}>起点</span>
              <input type="time" value={st} onChange={e=>setSt(e.target.value)}
                style={{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:7,padding:"6px 10px",color:"#fff",fontSize:18,fontWeight:700,fontVariantNumeric:"tabular-nums",outline:"none"}}/>
              <div style={{marginLeft:"auto",display:"flex",gap:4}}>
                <button onClick={undo} disabled={!hist.length} style={{...urBtn,opacity:hist.length?1:0.3}}>↩</button>
                <button onClick={redo} disabled={!futr.length} style={{...urBtn,opacity:futr.length?1:0.3}}>↪</button>
              </div>
            </div>
          </div>
        ):(
          <div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <button onClick={()=>goDay(shiftDay(aDate,-1))} style={navBtn}>◀</button>
                <div>
                  <div style={{fontSize:15,fontWeight:700}}>{fmtDateJP(aDate)}{isToday&&<span style={{fontSize:10,opacity:0.6,marginLeft:4}}>今日</span>}</div>
                  <div style={{fontSize:10,opacity:0.5}}>{fmtD(total)} → {toTime(toMin(st)+total)}終了</div>
                </div>
                <button onClick={()=>goDay(shiftDay(aDate,1))} style={navBtn}>▶</button>
                {!isToday&&<button onClick={()=>goDay(todayStr())} style={{...navBtn,fontSize:10,padding:"3px 6px"}}>今日</button>}
              </div>
              <div style={{display:"flex",gap:5,alignItems:"center"}}>
                {isToday&&<span style={{fontSize:18,fontWeight:700,fontVariantNumeric:"tabular-nums",opacity:0.9}}>{nowTime}</span>}
                {mode==="view"&&<button onClick={()=>up(rstChk(tasks))} style={hdrBtn}>リセット</button>}
                <button onClick={()=>{setMode(mode==="view"?"edit":"view");resetUI()}}
                  style={{...hdrBtn,...(mode==="edit"?{background:"#E8C547",color:"#1a1a2e"}:{})}}>
                  {mode==="edit"?"完了":"編集"}</button>
              </div>
            </div>
            <div style={{display:"flex",alignItems:"center",gap:10,marginTop:8}}>
              <span style={{fontSize:12,opacity:0.65}}>起点</span>
              <input type="time" value={st} onChange={e=>{setSt(e.target.value);save(tasks,e.target.value)}}
                style={{background:"rgba(255,255,255,0.1)",border:"1px solid rgba(255,255,255,0.2)",borderRadius:7,padding:"6px 10px",color:"#fff",fontSize:18,fontWeight:700,fontVariantNumeric:"tabular-nums",outline:"none"}}/>
              {isToday&&<button onClick={resync} style={{background:"rgba(255,255,255,0.12)",color:"#E8C547",border:"1px solid rgba(232,197,71,0.3)",borderRadius:7,padding:"5px 10px",fontSize:12,fontWeight:600,cursor:"pointer",whiteSpace:"nowrap"}}>⏱ 今から</button>}
              <div style={{marginLeft:"auto",display:"flex",gap:4}}>
                <button onClick={undo} disabled={!hist.length} style={{...urBtn,opacity:hist.length?1:0.3}}>↩</button>
                <button onClick={redo} disabled={!futr.length} style={{...urBtn,opacity:futr.length?1:0.3}}>↪</button>
              </div>
            </div>
          </div>
        )}
      </div>

      {/* Preset bar */}
      {!preEdit&&<div>
        <div style={{display:"flex",gap:6,padding:"6px 8px",alignItems:"center"}}>
          <button onClick={()=>setShowPre(showPre==="none"?"load":"none")} style={{...preBtn,...(showPre!=="none"?{background:"#2C3E50",color:"#fff",borderColor:"#2C3E50"}:{})}}>📂 プリセット</button>
        </div>
        {showPre!=="none"&&(
          <div style={{margin:"0 8px 6px",background:"#fff",borderRadius:8,border:"1px solid #e0e0e0",overflow:"hidden"}}>
            {presets.map(p=>(
              <div key={p.id} style={{display:"flex",alignItems:"center",padding:"8px 12px",borderBottom:"1px solid #f0f0f0"}}>
                <span style={{flex:1,fontSize:14}}>{p.name}</span>
                <button onClick={()=>loadPre(p)} style={{...savBtn,padding:"4px 10px",marginRight:4,fontSize:11}}>読み込み</button>
                <button onClick={()=>delPre(p.id)} style={{...canBtn,padding:"4px 8px",fontSize:11,color:"#D9534F"}}>✕</button>
              </div>
            ))}
            {/* Save current */}
            {tasks.length>0&&<div style={{padding:"8px 12px",borderTop:"1px solid #e0e0e0"}}>
              <div style={{fontSize:11,color:"#888",marginBottom:4}}>現在のタスクを保存</div>
              <div style={{display:"flex",gap:4}}>
                <input value={preName} onChange={e=>setPreName(e.target.value)} placeholder="プリセット名"
                  style={{...inpS,flex:1,fontSize:13,padding:"4px 8px"}}/>
                <button onClick={savePre} disabled={!preName.trim()}
                  style={{...savBtn,padding:"4px 10px",opacity:preName.trim()?1:0.4}}>保存</button>
              </div>
            </div>}
            {/* Create new */}
            <div style={{padding:"8px 12px",borderTop:"1px solid #e0e0e0",background:"#FAFAFA"}}>
              <div style={{fontSize:11,color:"#888",marginBottom:4}}>新規作成（ゼロから組み立て）</div>
              <div style={{display:"flex",gap:4}}>
                <input value={newPreName} onChange={e=>setNewPreName(e.target.value)} placeholder="プリセット名"
                  style={{...inpS,flex:1,fontSize:13,padding:"4px 8px"}}/>
                <button onClick={()=>{if(newPreName.trim()){startPreEdit(newPreName.trim());setNewPreName("")}}} disabled={!newPreName.trim()}
                  style={{...savBtn,padding:"4px 10px",background:"#5B3A8C",opacity:newPreName.trim()?1:0.4}}>作成</button>
              </div>
            </div>
          </div>
        )}
      </div>}

      {/* List */}
      <div style={{padding:"2px 6px 120px"}}>
        {movId&&<button onClick={()=>moveToTarget(null)} style={{width:"100%",padding:10,marginBottom:4,background:"#E8F4FD",border:"2px dashed #4A90D9",borderRadius:8,color:"#4A90D9",fontWeight:600,fontSize:13,cursor:"pointer",textAlign:"center"}}>↑ ルートへ移動</button>}
        {pendPre&&<button onClick={()=>placePre(null)} style={{width:"100%",padding:10,marginBottom:4,background:"#F3E8FD",border:"2px dashed #7B4FB0",borderRadius:8,color:"#7B4FB0",fontWeight:600,fontSize:13,cursor:"pointer",textAlign:"center"}}>↑ ルートに追加</button>}
        {items.length===0&&!movId&&(
          <div style={{textAlign:"center",padding:30,color:"#999"}}>
            <div style={{fontSize:14,marginBottom:12}}>この日のタスクはまだありません</div>
            {presets.length>0&&<button onClick={()=>setShowPre("load")} style={{...savBtn,padding:"8px 20px",fontSize:13}}>📂 プリセットから読み込む</button>}
          </div>
        )}
        {items.map(it=>{
          const isEd=editing===it.id,isSwp=swiped===it.id,isMov=movId===it.id,canMov=isMovable(it.id);
          const canPlace=!!pendPre;
          const isCurrent=isToday&&!it.isItem&&it.start<=nowMin&&nowMin<it.end&&it.showT;

          if(it.isItem){return(
            <div key={it.id+"i"} style={{marginBottom:1,position:"relative",overflow:"hidden",borderRadius:4,...(isMov?{outline:"2px solid #4A90D9",outlineOffset:-2}:{})}}>
              {mode==="view"&&!movId&&<div style={{position:"absolute",right:0,top:0,bottom:0,width:72,background:"#D9534F",display:"flex",alignItems:"center",justifyContent:"center"}}>
                <span onClick={e=>{e.stopPropagation();del(it.id)}} style={{color:"#fff",fontWeight:600,fontSize:13,padding:"8px 16px",cursor:"pointer"}}>削除</span></div>}
              <div onTouchStart={mode==="view"&&!movId?e=>onTS(e,it.id):undefined} onTouchMove={mode==="view"&&!movId?e=>onTM(e,it.id):undefined}
                onClick={mode==="view"&&isSwp?()=>setSwiped(null):(movId&&canMov?()=>moveToTarget(it.id):(canPlace?()=>placePre(it.id):undefined))}
                style={{display:"flex",alignItems:"center",background:isMov?"#E8F4FD":"#fff",position:"relative",zIndex:1,transition:"transform 0.2s ease",transform:isSwp?"translateX(-72px)":"translateX(0)",paddingLeft:it.depth*5+4,borderLeft:"2px solid #e8e8e8"}}>
                <div style={{width:it.depth*5,flexShrink:0}}/>
                <div style={{flex:1,padding:"6px 10px",opacity:it.chk?0.4:1}} onClick={mode==="view"&&!isSwp&&!movId?()=>toggle(it.id):undefined}>
                  {isEd?(<div style={{display:"flex",gap:6,alignItems:"center"}}>
                    <input value={eName} onChange={e=>setEName(e.target.value)} autoFocus style={{...inpS,flex:1}}/>
                    <button onClick={saveEd} style={savBtn}>保存</button><button onClick={()=>setEditing(null)} style={canBtn}>取消</button></div>)
                  :(<div style={{display:"flex",alignItems:"center",gap:6}}>
                    {mode==="view"&&!movId&&<span style={{width:16,height:16,borderRadius:8,flexShrink:0,display:"inline-flex",alignItems:"center",justifyContent:"center",border:it.chk?"none":"1.5px solid #ccc",background:it.chk?"#aaa":"transparent",color:"#fff",fontSize:9}}>{it.chk&&"✓"}</span>}
                    <span style={{fontSize:13,color:"#666",textDecoration:it.chk?"line-through":"none"}}>{it.name}</span>
                    {(movId&&canMov||canPlace)&&<span style={{marginLeft:"auto",fontSize:11,color:pendPre?"#7B4FB0":"#4A90D9",fontWeight:600}}>← ここへ</span>}
                  </div>)}
                </div>
                {mode==="edit"&&!isEd&&!movId&&<div style={{display:"flex",alignItems:"center",gap:1,paddingRight:2,flexShrink:0}}>
                  <button onClick={()=>startEd(it.id)} style={eBtn}>✎</button>
                  <button onClick={()=>setMovId(it.id)} style={{...eBtn,color:"#4A90D9"}}>⇄</button>
                  <button onClick={e=>{e.stopPropagation();del(it.id)}} style={{...eBtn,color:"#D9534F"}}>✕</button></div>}
              </div>
            </div>);
          }

          return(
            <div key={it.id+it.depth} style={{marginBottom:1,position:"relative",overflow:"hidden",borderRadius:6,...(isMov?{outline:"2px solid #4A90D9",outlineOffset:-2}:{})}}>
              {mode==="view"&&!movId&&<div style={{position:"absolute",right:0,top:0,bottom:0,width:72,background:"#D9534F",display:"flex",alignItems:"center",justifyContent:"center",borderRadius:"0 6px 6px 0"}}>
                <span onClick={e=>{e.stopPropagation();del(it.id)}} style={{color:"#fff",fontWeight:600,fontSize:13,padding:"8px 16px",cursor:"pointer"}}>削除</span></div>}
              <div onTouchStart={mode==="view"&&!movId?e=>onTS(e,it.id):undefined} onTouchMove={mode==="view"&&!movId?e=>onTM(e,it.id):undefined}
                onClick={mode==="view"&&isSwp?()=>setSwiped(null):(movId&&canMov?()=>moveToTarget(it.id):(canPlace?()=>placePre(it.id):undefined))}
                style={{display:"flex",alignItems:"stretch",background:isMov?"#E8F4FD":isCurrent?"#FFFDE7":(it.ad&&!it.grp?"#f4faf4":"#fff"),
                  position:"relative",zIndex:1,transition:"transform 0.2s ease",transform:isSwp?"translateX(-72px)":"translateX(0)",
                  ...(isCurrent?{boxShadow:"inset 3px 0 0 #E8C547"}:{})}}>
                <div style={{display:"flex",flexShrink:0}}>{it.colors.map((c,i)=><div key={i} style={{width:5,background:c,opacity:it.ad?0.3:0.85}}/>)}</div>
                <div style={{flex:1,padding:"9px 10px",minWidth:0,opacity:it.ad?0.4:1}}
                  onClick={mode==="view"&&!isSwp&&!movId?(it.grp?()=>togCol(it.id):()=>toggle(it.id)):undefined}>
                  {isEd?(<div style={{display:"flex",flexDirection:"column",gap:6}}>
                    <input value={eName} onChange={e=>setEName(e.target.value)} autoFocus style={inpS}/>
                    {!it.grp&&!it.isItem&&<div style={{display:"flex",alignItems:"center",gap:4}}>
                      <input value={eDur} onChange={e=>setEDur(e.target.value)} type="number" min="1" style={{...inpS,width:60}}/>
                      <span style={{fontSize:12,color:"#888"}}>分</span></div>}
                    <div style={{display:"flex",gap:6}}><button onClick={saveEd} style={savBtn}>保存</button><button onClick={()=>setEditing(null)} style={canBtn}>取消</button></div></div>)
                  :(<div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{display:"flex",alignItems:"center",gap:5}}>
                        {mode==="view"&&!it.grp&&!movId&&<span style={{width:18,height:18,borderRadius:4,flexShrink:0,display:"inline-flex",alignItems:"center",justifyContent:"center",border:(it.chk||it.ad)?"none":"2px solid #ccc",background:(it.chk||it.ad)?dc(it.depth):"transparent",color:"#fff",fontSize:11}}>{(it.chk||it.ad)&&"✓"}</span>}
                        {it.grp&&!movId&&<span onClick={e=>{e.stopPropagation();togCol(it.id)}} style={{fontSize:10,color:dc(it.depth),cursor:"pointer",flexShrink:0,userSelect:"none"}}>{it.col?"▶":"▼"}</span>}
                        <span style={{fontSize:14,fontWeight:it.grp?700:400,color:it.grp?dc(it.depth):"#1a1a2e",textDecoration:it.ad&&!it.grp?"line-through":"none"}}>{it.name}</span>
                        {it.hik&&!it.grp&&<span style={{fontSize:10,color:"#bbb",marginLeft:2}}>📋</span>}
                        {isCurrent&&<span style={{fontSize:9,background:"#E8C547",color:"#333",padding:"1px 5px",borderRadius:3,marginLeft:4,fontWeight:600}}>NOW</span>}
                      </div>
                      <div style={{fontSize:11,color:"#aaa",marginTop:1,paddingLeft:mode==="view"&&!it.grp&&!movId?23:it.grp?15:0}}>
                        {fmtD(it.dur)}{it.grp&&` (${it.dn}/${it.tt})`}</div>
                    </div>
                    <div style={{display:"flex",alignItems:"center",gap:6}}>
                      {(movId&&canMov||canPlace)&&<span style={{fontSize:11,color:pendPre?"#7B4FB0":"#4A90D9",fontWeight:600,whiteSpace:"nowrap"}}>← ここへ</span>}
                      {it.showT&&!movId&&<div style={{textAlign:"right",flexShrink:0}}>
                        <div style={{fontSize:15,fontWeight:700,fontVariantNumeric:"tabular-nums"}}>{toTime(it.start)}</div>
                        <div style={{fontSize:10,color:"#aaa",fontVariantNumeric:"tabular-nums"}}>〜{toTime(it.end)}</div></div>}
                    </div>
                  </div>)}
                </div>
                {mode==="edit"&&!isEd&&!movId&&<div style={{display:"flex",alignItems:"center",gap:1,paddingRight:2,flexShrink:0}}>
                  <button onClick={()=>startEd(it.id)} style={eBtn}>✎</button>
                  <button onClick={()=>setMovId(it.id)} style={{...eBtn,color:"#4A90D9"}}>⇄</button>
                  <button onClick={()=>{setAddTgt(addTgt===it.id?null:it.id);setNName("");setNDur("30");setNIsItem(false)}} style={{...eBtn,color:"#6BBF6A",fontWeight:700}}>+</button>
                  <button onClick={e=>{e.stopPropagation();del(it.id)}} style={{...eBtn,color:"#D9534F"}}>✕</button></div>}
              </div>
              {addTgt===it.id&&!movId&&addForm(it.id,it.depth)}
            </div>);
        })}
      </div>

      {movId&&movTask&&<div style={{position:"fixed",bottom:0,left:0,right:0,background:"#2C3E50",color:"#fff",padding:"12px 16px",zIndex:20,boxShadow:"0 -2px 12px rgba(0,0,0,0.2)"}}>
        <div style={{fontSize:12,opacity:0.7,marginBottom:8}}>「{movTask.name}」を移動中</div>
        <div style={{display:"flex",gap:8,justifyContent:"center"}}>
          <button onClick={()=>mv(movId,-1)} style={panBtn}>↑ 上へ</button>
          <button onClick={()=>mv(movId,1)} style={panBtn}>↓ 下へ</button>
          <button onClick={()=>setMovId(null)} style={{...panBtn,background:"rgba(255,255,255,0.15)"}}>取消</button></div></div>}

      {pendPre&&<div style={{position:"fixed",bottom:0,left:0,right:0,background:"#5B3A8C",color:"#fff",padding:"12px 16px",zIndex:20,boxShadow:"0 -2px 12px rgba(0,0,0,0.2)"}}>
        <div style={{fontSize:12,opacity:0.7,marginBottom:8}}>「{pendPre.name}」の配置先を選択</div>
        <div style={{display:"flex",gap:8,justifyContent:"center"}}>
          <button onClick={()=>setPendPre(null)} style={{...panBtn,background:"rgba(255,255,255,0.15)"}}>取消</button></div></div>}

      {mode==="edit"&&editing===null&&!movId&&!pendPre&&(
        <div style={{position:"fixed",bottom:16,left:0,right:0,display:"flex",justifyContent:"center",zIndex:10}}>
          {addTgt==="__root__"?addForm("__root__",-1)
          :addTgt===null?(<button onClick={()=>{setAddTgt("__root__");setNName("");setNDur("30");setNIsItem(false)}}
            style={{background:"#2C3E50",color:"#fff",border:"none",borderRadius:14,padding:"12px 24px",fontSize:14,fontWeight:700,cursor:"pointer",boxShadow:"0 3px 12px rgba(44,62,80,0.35)"}}>
            ＋ タスクを追加</button>):null}
        </div>)}
    </div>);
}

const loadS={display:"flex",justifyContent:"center",alignItems:"center",height:"100vh",fontFamily:"system-ui",color:"#4A90D9"};
const hdrBtn={background:"rgba(255,255,255,0.13)",color:"#fff",border:"none",borderRadius:7,padding:"6px 12px",fontSize:12,fontWeight:600,cursor:"pointer"};
const navBtn={background:"rgba(255,255,255,0.1)",color:"#fff",border:"none",borderRadius:6,padding:"4px 8px",fontSize:14,cursor:"pointer"};
const urBtn={background:"none",border:"1px solid rgba(255,255,255,0.25)",borderRadius:6,padding:"5px 8px",fontSize:16,color:"#fff",cursor:"pointer",lineHeight:1};
const inpS={border:"1px solid #ddd",borderRadius:5,padding:"5px 7px",fontSize:16};
const savBtn={background:"#2C3E50",color:"#fff",border:"none",borderRadius:5,padding:"5px 12px",fontSize:12,fontWeight:600,cursor:"pointer"};
const canBtn={background:"#eee",border:"none",borderRadius:5,padding:"5px 12px",fontSize:12,cursor:"pointer"};
const eBtn={background:"none",border:"none",padding:"4px 8px",fontSize:14,cursor:"pointer",color:"#2C3E50"};
const panBtn={background:"#4A90D9",color:"#fff",border:"none",borderRadius:8,padding:"10px 18px",fontSize:14,fontWeight:600,cursor:"pointer"};
const preBtn={background:"#fff",border:"1px solid #ddd",borderRadius:6,padding:"4px 10px",fontSize:12,color:"#555",cursor:"pointer"};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
